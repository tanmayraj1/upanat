<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./image-slot.js"></script><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap"><style>button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}</style></helmet>
<div onMouseEnter="{{ enter }}" onMouseLeave="{{ leave }}" style="display:flex;flex-direction:column;gap:16px;min-width:0;font-family:'Public Sans',system-ui,sans-serif;color:#221A14;transform:translateY({{ lift }}px);transition:transform 380ms cubic-bezier(.22,.61,.36,1)">
  <div onClick="{{ open }}" style="position:relative;aspect-ratio:4 / 5;background:#FBF6EE;border:1px solid {{ frameBd }};cursor:pointer;color:#6E6154;box-shadow:{{ shadow }};transition:box-shadow 380ms cubic-bezier(.22,.61,.36,1), border-color 380ms cubic-bezier(.22,.61,.36,1)">
    <div style="position:absolute;inset:8px;overflow:hidden;background:#EFE6D8">
      <div style="position:absolute;inset:0;transform:scale({{ zoom }});transition:transform 900ms cubic-bezier(.22,.61,.36,1)"><image-slot id="p-{{ p.slug }}-1" shape="rect" src="{{ p.img1 }}" placeholder="{{ p.name }} · front"></image-slot></div>
      <div style="position:absolute;inset:0;opacity:{{ img2 }};pointer-events:{{ img2pe }};transform:scale({{ zoom }});transition:opacity 420ms cubic-bezier(.22,.61,.36,1), transform 900ms cubic-bezier(.22,.61,.36,1)"><image-slot id="p-{{ p.slug }}-2" shape="rect" src="{{ p.img2 }}" placeholder="{{ p.name }} · second angle"></image-slot></div>
    </div>
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#C9972E" stroke-width="1.4" style="position:absolute;top:-5px;left:-5px;pointer-events:none"><path pathLength="1" stroke-dasharray="1" d="M1 19V1h18" style="stroke-dashoffset:{{ cOff }};transition:stroke-dashoffset 420ms cubic-bezier(.22,.61,.36,1)"></path></svg>
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#C9972E" stroke-width="1.4" style="position:absolute;top:-5px;right:-5px;transform:scaleX(-1);pointer-events:none"><path pathLength="1" stroke-dasharray="1" d="M1 19V1h18" style="stroke-dashoffset:{{ cOff }};transition:stroke-dashoffset 420ms cubic-bezier(.22,.61,.36,1) 60ms"></path></svg>
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#C9972E" stroke-width="1.4" style="position:absolute;bottom:-5px;left:-5px;transform:scaleY(-1);pointer-events:none"><path pathLength="1" stroke-dasharray="1" d="M1 19V1h18" style="stroke-dashoffset:{{ cOff }};transition:stroke-dashoffset 420ms cubic-bezier(.22,.61,.36,1) 120ms"></path></svg>
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#C9972E" stroke-width="1.4" style="position:absolute;bottom:-5px;right:-5px;transform:scale(-1,-1);pointer-events:none"><path pathLength="1" stroke-dasharray="1" d="M1 19V1h18" style="stroke-dashoffset:{{ cOff }};transition:stroke-dashoffset 420ms cubic-bezier(.22,.61,.36,1) 180ms"></path></svg>
    <div style="position:absolute;top:18px;left:18px;display:flex;gap:6px;pointer-events:none">
      <sc-if value="{{ isNew }}" hint-placeholder-val="{{ false }}"><span style="background:#FBF6EE;color:#0F4C3A;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;padding:6px 9px 5px;font-weight:700">New</span></sc-if>
      <sc-if value="{{ isBest }}" hint-placeholder-val="{{ false }}"><span style="background:#0F4C3A;color:#E8C36B;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;padding:6px 9px 5px;font-weight:700">Bestseller</span></sc-if>
      <sc-if value="{{ isSold }}" hint-placeholder-val="{{ false }}"><span style="background:#221A14;color:#FBF6EE;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;padding:6px 9px 5px;font-weight:700">Sold out</span></sc-if>
    </div>
    <div style="position:absolute;top:16px;right:16px;display:flex;flex-direction:column;gap:8px">
      <button onClick="{{ wish }}" aria-label="{{ wishLabel }}" style="width:38px;height:38px;border-radius:50%;background:rgba(251,246,238,.95);box-shadow:0 6px 16px -8px rgba(34,26,20,.45);display:flex;align-items:center;justify-content:center;transition:transform 220ms cubic-bezier(.22,.61,.36,1), box-shadow 240ms" style-hover="transform:scale(1.08);box-shadow:0 6px 14px -6px rgba(34,26,20,.4)" style-active="transform:scale(.9)">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="{{ heartFill }}" stroke="{{ heartStroke }}" stroke-width="1.5" stroke-linejoin="round" style="transition:fill 280ms, stroke 280ms"><path d="M12 20s-7.5-4.6-7.5-10.1C4.5 7.2 6.6 5 9.1 5c1.3 0 2.3.6 2.9 1.6.6-1 1.6-1.6 2.9-1.6 2.5 0 4.6 2.2 4.6 4.9C19.5 15.4 12 20 12 20z"></path></svg>
      </button>
      <button onClick="{{ quick }}" aria-label="Quick add" style="width:38px;height:38px;border-radius:50%;background:rgba(251,246,238,.95);box-shadow:0 6px 16px -8px rgba(34,26,20,.45);display:flex;align-items:center;justify-content:center;opacity:{{ actOp }};transform:translateX({{ qX }}px);pointer-events:{{ actPe }};transition:opacity 260ms, transform 320ms cubic-bezier(.22,.61,.36,1) 40ms" style-active="transform:scale(.9)">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#221A14" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7.5c-.8-1.2-1.2-2.4-1-3.5 1.6.3 3.2.6 5 .6s3.4-.3 5-.6c.2 1.1-.2 2.3-1 3.5"></path><path d="M8 7.5h8"></path><path d="M8 7.5C5.3 9.6 4 12.6 4 15.4 4 18.6 7.4 20.5 12 20.5s8-1.9 8-5.1c0-2.8-1.3-5.8-4-7.9"></path></svg>
      </button>
    </div>
    <div onClick="{{ stop }}" style="position:absolute;left:16px;right:16px;bottom:16px;background:#FBF6EE;padding:11px 12px 12px;display:flex;flex-direction:column;gap:9px;opacity:{{ actOp }};transform:translateY({{ actY }}px);pointer-events:{{ actPe }};transition:opacity 260ms cubic-bezier(.22,.61,.36,1), transform 360ms cubic-bezier(.22,.61,.36,1);cursor:default;box-shadow:0 10px 24px -14px rgba(34,26,20,.4)">
      <sc-if value="{{ added }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;align-items:center;gap:8px;height:30px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#0F4C3A;font-weight:700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0F4C3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path data-draw="1" data-dur="380" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0" d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Added to bag</div>
      </sc-if>
      <sc-if value="{{ showSizes }}" hint-placeholder-val="{{ true }}">
        <div style="font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#6E6154;font-weight:600">Add to bag · pick a size</div>
        <div style="display:flex;gap:5px">
          <sc-for list="{{ sizes }}" as="s" hint-placeholder-count="6">
            <button onClick="{{ s.pick }}" style="flex:1;min-width:0;height:30px;border:1px solid #D9CDB8;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;transition:background 200ms, color 200ms, border-color 200ms, transform 200ms cubic-bezier(.22,.61,.36,1)" style-hover="background:#0F4C3A;color:#FBF6EE;border-color:#0F4C3A;transform:translateY(-1px)" style-active="transform:scale(.9)">{{ s.label }}</button>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ isSold }}" hint-placeholder-val="{{ false }}">
        <div style="height:30px;display:flex;align-items:center;font-size:12.5px;color:#6E6154">Sold out in all sizes</div>
      </sc-if>
    </div>
  </div>
  <div onClick="{{ open }}" style="display:flex;flex-direction:column;gap:5px;cursor:pointer">
    <div style="font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#8C6516;font-weight:600">{{ p.cat }}</div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">
      <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;line-height:1;font-weight:600;letter-spacing:-.01em">{{ p.name }}</div>
      <div style="display:flex;align-items:baseline;gap:8px;white-space:nowrap;font-variant-numeric:tabular-nums"><sc-if value="{{ hasWas }}" hint-placeholder-val="{{ false }}"><s style="font-size:13px;color:#8A7C6D">{{ p.wasLabel }}</s></sc-if><span style="font-size:15.5px;font-weight:700;color:{{ priceFg }}">{{ p.priceLabel }}</span></div>
    </div>
    <div style="font-size:13px;color:#6E6154;line-height:1.45;text-wrap:pretty">{{ p.short }}</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:540},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;wished&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;added&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;touch&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onWish&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onQuick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onAdd&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(size:number) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { h: false };
  renderVals() {
    const p = this.props.p || { name: '', slug: 'x', sizes: [], cat: '', priceLabel: '', short: '' };
    const h = this.state.h, touch = !!this.props.touch, show = h || touch, wished = !!this.props.wished, added = !!this.props.added;
    return {
      p,
      enter: () => this.setState({ h: true }),
      leave: () => this.setState({ h: false }),
      lift: h ? -5 : 0, zoom: h ? 1.04 : 1,
      shadow: h ? '0 18px 36px -18px rgba(34,26,20,.38)' : '0 0 0 0 rgba(34,26,20,0)',
      frameBd: h ? 'rgba(201,151,46,.9)' : 'rgba(201,151,46,.45)',
      cOff: show ? 0 : 1,
      img2: h ? 1 : 0, img2pe: h ? 'auto' : 'none',
      actOp: show ? 1 : 0, actY: show ? 0 : 10, qX: show ? 0 : 8, actPe: show ? 'auto' : 'none',
      hasWas: !!p.was, priceFg: p.was ? '#0F4C3A' : '#221A14', isNew: p.badge === 'New' && !p.soldOut, isBest: p.badge === 'Bestseller' && !p.soldOut, isSold: !!p.soldOut,
      heartFill: wished ? '#6B1F2A' : 'rgba(107,31,42,0)', heartStroke: wished ? '#6B1F2A' : '#221A14',
      wishLabel: wished ? 'Remove from wishlist' : 'Save to wishlist',
      added, showSizes: !added && !p.soldOut,
      sizes: (p.sizes || []).map(s => ({ label: s, pick: e => { e.stopPropagation(); this.props.onAdd && this.props.onAdd(s); } })),
      open: () => this.props.onOpen && this.props.onOpen(),
      wish: e => {
        e.stopPropagation();
        const svg = e.currentTarget.firstChild;
        if (svg && svg.animate) svg.animate(wished
          ? [{ transform: 'scale(1)' }, { transform: 'scale(.8)' }, { transform: 'scale(1)' }]
          : [{ transform: 'scale(1)' }, { transform: 'scale(1.4)', offset: .4 }, { transform: 'scale(.9)', offset: .7 }, { transform: 'scale(1)' }], { duration: 440, easing: 'cubic-bezier(.22,.61,.36,1)' });
        this.props.onWish && this.props.onWish();
      },
      quick: e => { e.stopPropagation(); this.props.onQuick && this.props.onQuick(); },
      stop: e => e.stopPropagation()
    };
  }
  componentDidUpdate(pp) {
    if (!pp.added && this.props.added) setTimeout(() => {
      const el = document.querySelectorAll('[data-draw]');
      el.forEach(x => { if (x.__dr || !x.animate) return; x.__dr = true; x.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: +x.dataset.dur || 400, easing: 'cubic-bezier(.45,0,.2,1)', fill: 'backwards' }); });
    }, 10);
  }
}
</script>
</body>
</html>
